name: Deploy to GitHub Pages

# 触发时机：推送到 main 分支，或在 Actions 页面手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免并发推送互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        # 版本只在这里指定一处：package.json 里不要再写 packageManager，
        # 两处都写会让 action-setup 的版本校验互相冲突而直接失败。
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        # 不用 --frozen-lockfile：本地 pnpm 版本与 CI 可能存在小差异，
        # 硬校验 lockfile 会在无关紧要的地方把流程卡住。
        run: pnpm install --no-frozen-lockfile

      - name: 构建静态站点
        # vite.config.js 会读取 GITHUB_REPOSITORY 自动推导 /<仓库名>/ 作为 base
        run: pnpm run build

      - name: 关闭 Jekyll 处理
        # 下划线开头的文件/目录会被 Jekyll 忽略，加上这个标记跳过处理
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # 首次部署时自动启用 Pages 并设为「GitHub Actions」来源；
          # 若仓库已手动启用，这一步是无副作用的空操作。
          # 依赖工作流顶部的 permissions: pages: write。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
